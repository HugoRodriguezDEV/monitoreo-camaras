# go2rtc de la PC central. Copiar a /etc/go2rtc/go2rtc.yaml y llenar con los datos
# del levantamiento (docs/PLAN.md → "Levantamiento por sucursal").
# Este archivo de ejemplo no lleva contraseñas reales; el real NO se sube a git.
#
# Rutas Hikvision/Epcom/EZVIZ:  /Streaming/Channels/N02 = substream (cuadrícula)
#                               /Streaming/Channels/N01 = principal (en grande)
# Canal 3 en substream = 302.

api:
  listen: ":1984"
  # go2rtc sirve la interfaz compilada: http://localhost:1984/
  static_dir: /opt/monitoreo-camaras/dist

webrtc:
  candidates:
    - 127.0.0.1:8555

streams:
  # ── Sucursal 1 (Epcom / Hik-Connect) — IP local vista a través de Tailscale ──
  s1_cam1: rtsp://admin:PASS@192.168.1.64:554/Streaming/Channels/102
  s1_cam1_hd: rtsp://admin:PASS@192.168.1.64:554/Streaming/Channels/101
  s1_cam2: rtsp://admin:PASS@192.168.1.64:554/Streaming/Channels/202
  s1_cam3: rtsp://admin:PASS@192.168.1.64:554/Streaming/Channels/302
  s1_cam4: rtsp://admin:PASS@192.168.1.64:554/Streaming/Channels/402

  # ── Sucursal 2 (EZVIZ) — la contraseña suele ser el código de la etiqueta ──
  s2_cam1: rtsp://admin:CODIGO@192.168.2.50:554/Streaming/Channels/102
  s2_cam2: rtsp://admin:CODIGO@192.168.2.50:554/Streaming/Channels/202

  # ── Sucursal 3 ──
  s3_cam1: rtsp://admin:PASS@192.168.3.64:554/Streaming/Channels/102
  s3_cam2: rtsp://admin:PASS@192.168.3.64:554/Streaming/Channels/202
  s3_cam3: rtsp://admin:PASS@192.168.3.64:554/Streaming/Channels/302

  # ── Sucursal 4 ──
  s4_cam1: rtsp://admin:PASS@192.168.4.64:554/Streaming/Channels/102
