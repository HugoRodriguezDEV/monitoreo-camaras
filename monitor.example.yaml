datos: /var/lib/monitor

servidor:
  escuchar: ":8080"
go2rtc:
  binario: /usr/local/bin/go2rtc
  api: "127.0.0.1:1984"
  config: /var/lib/monitor/go2rtc.yaml
  externo: false
interfaz:
  rotacion_segundos: 25
  rotar_vista_general: true
  volver_a_cuadricula_segundos: 60
salud:
  intervalo_segundos: 10
  caido_tras_fallos: 3
  recuperar_tras_minutos: 3
alertas:
  telegram:
    token: ""
    chat_id: ""
# Opcional. Solo se importa al crear el almacén.
sucursales: []
