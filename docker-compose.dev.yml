# Solo para desarrollo en la laptop: go2rtc con cámaras de prueba.
#   docker compose -f docker-compose.dev.yml up -d
#   npm run dev   →  http://localhost:3000
services:
  go2rtc:
    image: alexxit/go2rtc:latest
    ports:
      - "1984:1984"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    volumes:
      - ./deploy/go2rtc.dev.yaml:/config/go2rtc.yaml:ro
    restart: unless-stopped
