name: Release

# Publica los binarios al crear una etiqueta: git tag v0.1.0 && git push --tags
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: npm ci && npm run build
        working-directory: web
      - run: go test ./...
      - name: Compilar
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "dist/monitor-linux-$arch" ./cmd/monitor
          done
          cp monitor.example.yaml deploy/pc-central/instalar.sh deploy/pc-central/monitor.service dist/
          cd dist && sha256sum monitor-linux-* > SHA256SUMS
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"

  windows:
    name: Instalador para Windows
    needs: release
    runs-on: windows-latest
    env:
      CGO_ENABLED: '0'
      GOOS: windows
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: npm ci && npm run build
        working-directory: web
      - name: Compilar el asistente portable
        run: go build -trimpath -tags desktop,production -ldflags '-s -w -H windowsgui' -o dist/MonitorCamaras-Instalador.exe ./cmd/instalador
      - name: Crear el paquete NSIS
        run: |
          $nsis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (!$nsis) { $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe' }
          if (!(Test-Path -LiteralPath $nsis)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $nsis /WX /INPUTCHARSET UTF8 "/DPORTABLE=$PWD\dist\MonitorCamaras-Instalador.exe" "/DSALIDA=$PWD\dist\MonitorCamaras-Instalador-Setup.exe" cmd/instalador/build/windows/instalador.nsi
      - name: Adjuntar los ejecutables al release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:GITHUB_REF_NAME dist/MonitorCamaras-Instalador.exe dist/MonitorCamaras-Instalador-Setup.exe
