name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Interfaz web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint src
      - run: npx vite build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist

  go:
    name: Monitor en Go
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - run: go vet ./...
      - run: go test -race ./...
      - name: Compilar para Linux (amd64 y arm64)
        run: |
          GOOS=linux GOARCH=amd64 go build -o dist/monitor-linux-amd64 ./cmd/monitor
          GOOS=linux GOARCH=arm64 go build -o dist/monitor-linux-arm64 ./cmd/monitor
      - uses: actions/upload-artifact@v7
        with:
          name: monitor
          path: dist/

  windows:
    name: Monitor e instalador para Windows
    runs-on: windows-latest
    env:
      CGO_ENABLED: '0'
      GOOS: windows
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: npm ci && npm run build
        working-directory: web
      - name: Compilar para Windows
        run: |
          go build -tags desktop,production -ldflags '-H windowsgui' -o dist/MonitorCamaras-Instalador.exe ./cmd/instalador
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -o dist/monitor-windows-amd64.exe ./cmd/monitor
      - uses: actions/upload-artifact@v7
        with:
          name: monitor-windows
          path: dist/*.exe
          if-no-files-found: error
