name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Interfaz web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint src
      - run: npx vite build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  go:
    name: Monitor en Go
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: go vet ./...
      - run: go test -race ./...
      - name: Compilar para Linux (amd64 y arm64)
        run: |
          GOOS=linux GOARCH=amd64 go build -o dist/monitor-linux-amd64 ./cmd/monitor
          GOOS=linux GOARCH=arm64 go build -o dist/monitor-linux-arm64 ./cmd/monitor
      - uses: actions/upload-artifact@v4
        with:
          name: monitor
          path: dist/
